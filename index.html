<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#F8F5ED" />

    <meta
      name="description"
      content="Explore rooms, dining and event venues at Hotel Shantam Regency, Bhagalpur, Bihar."
    />

    <title>Hotel Shantam Regency | Stay, Dine & Celebrate</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: connection optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Combined Google Fonts request -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anta&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Jim+Nightshade&family=Tiro+Devanagari+Hindi:ital@0;1&family=Updock&display=swap"
      rel="stylesheet"
    />

    <!-- Local font -->
    <style>
      @font-face {
        font-family: "Spicy Rice";
        src: url("/fonts/SpicyRice-Regular.ttf") format("truetype");
        font-display: swap;
      }
    </style>

    <link
      rel="preload"
      as="image"
      href="/images/hotel-hero-desktop.webp"
      fetchpriority="high"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
